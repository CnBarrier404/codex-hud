name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 executable
    runs-on: windows-latest
    outputs:
      executable_filename: ${{ steps.release.outputs.executable_filename }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
          rustup override set 1.98.1

      - name: Validate release version and prepare notes
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/prepare-release.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Build release executable
        run: npm run tauri build -- --ci --no-bundle --target x86_64-pc-windows-msvc -- --locked

      - name: Stage executable
        shell: pwsh
        env:
          EXECUTABLE_FILENAME: ${{ steps.release.outputs.executable_filename }}
        run: |
          $sourcePath = "src-tauri/target/x86_64-pc-windows-msvc/release/codex-hud.exe"
          if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
            throw "Release executable not found: $sourcePath"
          }
          Copy-Item -LiteralPath $sourcePath -Destination "artifacts/$env:EXECUTABLE_FILENAME"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            artifacts/${{ steps.release.outputs.executable_filename }}
            artifacts/release-notes.md
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: artifacts/release-notes.md
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: artifacts/${{ needs.build.outputs.executable_filename }}
